[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moodmeals"
version = "0.0.1"
description = "A 'kya khana hai, batao' agent that decides between cooking and ordering in."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["moodmeals*"]

[tool.setuptools.package-data]
"moodmeals.providers" = ["fixtures/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "specs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
