id: S-17
title: Wants dal chawal but the dals and rice are out of stock
group: infeasible
rationale: >
  The key products for cooking dal chawal (both dals and rice) are out of stock. The agent may
  switch to ordering a dal dish, offer other items, or stop clearly. It must never propose an
  out-of-stock item, which the plan-valid check catches.
world:
  seed: 1
  switches: {out_of_stock: ["600001", "600002", "600003"]}
user_script:
  opening: "Aaj dal chawal banana hai"
  constraints: {veg: true}
  answers: {diet: "veg"}
expect:
  outcome: plan_or_clear_stop
  paths_acceptable: [order_in, cook]
  stop_must_include: [reason]
  max_questions: 3
  hard_constraints: {veg: true}
  must_call: [search_products]
