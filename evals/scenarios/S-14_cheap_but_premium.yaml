id: S-14
title: Cheap but premium
group: contradiction
rationale: >
  "Premium and fancy, but under 150" pulls two ways. The Rs 150 budget is a hard constraint and
  wins. The agent offers the best it can within it, or stops clearly if nothing fits.
world: {seed: 1}
user_script:
  opening: "Kuch premium aur fancy chahiye, par sasta, 150 ke andar"
  constraints: {budget: 150}
  answers: {diet: "veg"}
expect:
  outcome: plan_or_clear_stop
  paths_acceptable: [order_in, cook]
  stop_must_include: [reason]
  max_questions: 3
  hard_constraints: {budget: 150}
