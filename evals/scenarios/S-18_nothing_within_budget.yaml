id: S-18
title: Nothing fits a Rs 20 budget
group: infeasible
rationale: >
  With prices raised, the cheapest dish and the cheapest grocery item are both above Rs 20, so
  every plan breaks the hard budget. The agent says so and stops clearly after trying both
  restaurants and Instamart. It must not stretch the budget.
world:
  seed: 1
  switches: {price_scale: 1.5}
user_script:
  opening: "Dinner chahiye, budget sirf 20 rupaye"
  constraints: {budget: 20, veg: true}
  answers: {diet: "veg"}
expect:
  outcome: clear_stop
  stop_must_include: [reason]
  max_questions: 3
  must_call: [search_restaurants, search_products]
