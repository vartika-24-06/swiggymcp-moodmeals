id: S-05
title: Restaurant search keeps timing out
group: tool_failure
smoke: true
rationale: >
  The person wants to order, but restaurant search always times out. The agent retries once,
  then switches to Cook or stops with a clear explanation (R9.1). It must not invent a
  restaurant, so order_in is not acceptable.
world:
  seed: 1
  switches: {fail_tools: {search_restaurants: timeout}}
user_script:
  opening: "Dinner order karna hai, veg"
  answers: {diet: "veg"}
expect:
  outcome: plan_or_clear_stop
  paths_acceptable: [cook]
  max_questions: 3
  hard_constraints: {veg: true}
  must_call: [search_restaurants]
