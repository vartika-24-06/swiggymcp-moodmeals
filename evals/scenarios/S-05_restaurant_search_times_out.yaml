id: S-05
title: Restaurant search keeps timing out
group: tool_failure
smoke: true
rationale: >
  The person wants to order, but restaurant search always times out. The agent retries once
  (R9.1), then, by the owner's rule (2026-10-05), offers a ready-to-eat or quick-cook meal
  from Instamart with a reason that says ordering is not working, or stops and says why. It
  must not invent a restaurant.
world:
  seed: 1
  switches: {fail_tools: {search_restaurants: timeout}}
user_script:
  opening: "Dinner order karna hai, veg"
  answers: {diet: "veg"}
expect:
  outcome: plan_or_clear_stop
  paths_acceptable: [cook]
  plan_must_include: [blocked_reason, quick_meal]
  stop_must_include: [reason]
  max_questions: 3
  hard_constraints: {veg: true}
  must_call: [search_restaurants, search_products]
