id: S-04
title: Wants biryani but every restaurant is closed
group: infeasible
smoke: true
rationale: >
  Order in is impossible (R4.3). The agent should say so and move to Cook, or stop clearly.
  It must never propose a plan from a closed restaurant, so order_in is not acceptable.
world:
  seed: 1
  switches: {all_closed: true}
user_script:
  opening: "Biryani khani hai"
  answers: {diet: "non veg"}
  constraints: {budget: 500}
expect:
  outcome: plan_or_clear_stop
  paths_acceptable: [cook]
  max_questions: 3
  hard_constraints: {budget: 500}
  must_call: [search_restaurants]
