id: S-04
title: Wants biryani but every restaurant is closed
group: infeasible
smoke: true
rationale: >
  Order in is impossible (R4.3). The owner's rule (2026-10-05): the agent says it cannot
  order and why, and offers to cook a similar dish. It does not quietly switch to a cook
  plan, and it must never propose a plan from a closed restaurant.
world:
  seed: 1
  switches: {all_closed: true}
user_script:
  opening: "Biryani khani hai"
  answers: {diet: "non veg"}
  constraints: {budget: 500}
expect:
  outcome: clear_stop
  stop_must_include: [reason, offer_cook_similar]
  max_questions: 3
  must_call: [search_restaurants]
