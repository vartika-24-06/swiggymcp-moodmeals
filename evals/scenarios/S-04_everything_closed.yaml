id: S-04
title: Wants biryani but every restaurant is closed
group: infeasible
smoke: true
rationale: >
  Order in is impossible (R4.3). The owner's rule (2026-10-05): the agent offers a ready-to-eat
  or quick-cook meal from Instamart, with a reason that says restaurants are closed, or it stops
  and says why. It never proposes a plan from a closed restaurant and does not build a full
  recipe shopping list.
world:
  seed: 1
  switches: {all_closed: true}
user_script:
  opening: "Biryani khani hai"
  answers: {diet: "non veg"}
  constraints: {budget: 500}
expect:
  outcome: plan_or_clear_stop
  paths_acceptable: [cook]
  plan_must_include: [blocked_reason, quick_meal]
  stop_must_include: [reason]
  max_questions: 3
  hard_constraints: {budget: 500}
  must_call: [search_restaurants, search_products]
